services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: lokayana-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      # Optional: bind mount code saat development agar perubahan langsung terbaca (hot reload)
      - ./apps/backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
